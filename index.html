    // Initialize Menu
    function initMenu() {
        const menuContainer = document.getElementById('menu-container');
        chaptersData.forEach((ch, index) => {
            const btn = document.createElement('div');
            btn.className = 'menu-btn';
            btn.innerHTML = `<h3>BAB ${ch.num}</h3><p>${ch.desc}</p>`;
            btn.onclick = () => openChapter(index);
            menuContainer.appendChild(btn);
        });
    }

    let currentIndex = 0;

    function openChapter(index) {
        currentIndex = index;
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('chapter-screen').style.display = 'block';
        window.scrollTo(0, 0);
        renderChapter();
    }

    function goHome() {
        document.getElementById('chapter-screen').style.display = 'none';
        document.getElementById('home-screen').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function changeChapter(dir) {
        const newIndex = currentIndex + dir;
        if (newIndex >= 0 && newIndex < chaptersData.length) {
            currentIndex = newIndex;
            renderChapter();
            window.scrollTo(0, 0);
        }
    }

    function renderChapter() {
        const ch = chaptersData[currentIndex];
        document.getElementById('ch-title').innerText = ch.title;
        document.getElementById('ch-desc').innerText = ch.desc;
        
        let contentHtml = '';
        
        ch.patterns.forEach(pt => {
            let exHtml = '';
            pt.examples.forEach(ex => {
                exHtml += `
                    <div class="example-item">
                        <span class="jp-text">${ex.jp}</span>
                        <span class="id-text">"${ex.id}"</span>
                    </div>
                `;
            });

            let tipsHtml = pt.tips ? `<div class="warning-box">${pt.tips}</div>` : '';

            contentHtml += `
                <div class="pattern-card">
                    <h2>${pt.title}</h2>
                    <div class="logic-box">${pt.logic}</div>
                    ${tipsHtml}
                    <div class="example-container">
                        <h4 style="color:#fff; margin-top:0; border-bottom:2px solid rgba(255,255,255,0.1); padding-bottom:10px;">🌟 CONTOH KALIMAT:</h4>
                        ${exHtml}
                    </div>
                </div>
            `;
        });

        document.getElementById('ch-content').innerHTML = contentHtml;

        document.getElementById('btn-prev').disabled = currentIndex === 0;
        document.getElementById('btn-next').disabled = currentIndex === chaptersData.length - 1;
    }

    // Run on load
    initMenu();
